services:
  db:
    image: mysql:8.4
    container_name: tcgtrader-db
    environment:
      MYSQL_DATABASE: tcgtrader
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - tcgtrader_data:/var/lib/mysql

volumes:
  tcgtrader_data:
